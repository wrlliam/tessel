name: Release

# Every push to main is released: installers for macOS, Windows and Linux are built and
# published as v<major>.<minor>.<run number>, with notes listing the commits since the last one.
# Installed copies of Tessel find it through the latest*.yml files and update themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, in push order; a newer push doesn't cancel one that's building.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          base=$(node -p "require('./packages/desktop/package.json').version.split('.').slice(0, 2).join('.')")
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            files: |
              bin/*.dmg
              bin/*.zip
              bin/*.blockmap
              bin/latest-mac.yml
          - os: windows-latest
            files: |
              bin/*.exe
              bin/*.blockmap
              bin/latest.yml
          - os: ubuntu-latest
            files: |
              bin/*.AppImage
              bin/*.deb
              bin/latest-linux.yml
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Signing is optional. Without these secrets the builds are unsigned (see docs/packaging.md).
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stamp the version
        shell: bash
        run: |
          node -e "const f='packages/desktop/package.json';const p=require('./'+f);p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
      - name: Build
        run: pnpm build:plugins && pnpm stage:plugins && pnpm --filter @tessel/phone build && pnpm --filter @tessel/desktop build
      - name: Package
        shell: bash
        working-directory: packages/desktop
        run: |
          # The release job publishes; electron-builder only builds here.
          extra=""
          if [ -n "$APPLE_ID" ] && [ "$RUNNER_OS" = "macOS" ]; then extra="--config.mac.notarize=true"; fi
          pnpm exec electron-builder --publish never $extra
      - uses: actions/upload-artifact@v7
        with:
          name: tessel-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "## Download"
            echo
            echo "- **macOS** (Apple silicon and Intel): \`Tessel-${VERSION}-universal.dmg\`"
            echo "- **Windows** (x64): \`Tessel-Setup-${VERSION}.exe\`"
            echo "- **Linux**: \`.AppImage\` or \`.deb\`"
            echo
            echo "Builds aren't signed yet. On macOS, right-click Tessel, choose Open, then Open again. On Windows, choose More info, then Run anyway. Installed copies update themselves (macOS shows a download link)."
          } > notes.md
          gh release create "v${VERSION}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "Tessel ${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            --latest
