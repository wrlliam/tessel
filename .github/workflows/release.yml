name: Release

# Every push to main is released: installers for macOS, Windows and Linux are built and
# published as v<major>.<minor>.<run number>, with notes listing the commits since the last one.
# Installed copies of Tessel find it through the latest*.yml files and update themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, in push order; a newer push doesn't cancel one that's building.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          base=$(node -p "require('./packages/desktop/package.json').version.split('.').slice(0, 2).join('.')")
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            files: |
              bin/*.dmg
              bin/*.zip
              bin/*.blockmap
              bin/latest-mac.yml
          - os: windows-latest
            files: |
              bin/*.exe
              bin/*.blockmap
              bin/latest.yml
          - os: ubuntu-latest
            files: |
              bin/*.AppImage
              bin/*.deb
              bin/latest-linux.yml
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Signing is optional. Without these secrets the builds are unsigned (see docs/packaging.md).
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stamp the version
        shell: bash
        run: |
          node -e "const f='packages/desktop/package.json';const p=require('./'+f);p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
      - name: Build
        run: pnpm build:plugins && pnpm stage:plugins && pnpm --filter @tessel/phone build && pnpm --filter @tessel/desktop build
      - name: Package
        shell: bash
        working-directory: packages/desktop
        run: |
          # Empty secrets arrive as empty strings, which electron-builder reads as a file path.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          # The release job publishes; electron-builder only builds here.
          extra=""
          if [ -n "$APPLE_ID" ] && [ "$RUNNER_OS" = "macOS" ]; then extra="--config.mac.notarize=true"; fi
          pnpm exec electron-builder --publish never $extra
      - uses: actions/upload-artifact@v7
        with:
          name: tessel-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  plugins:
    name: Publish the plugin catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:plugins && pnpm pack:catalog
      - name: Upload to the plugins release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release, so installed copies of Tessel never mistake it for an app update.
          if ! gh release view plugins >/dev/null 2>&1; then
            gh release create plugins --prerelease --latest=false --title "Plugins" \
              --notes "Optional plugins for Tessel. Install them from Tessel's Plugins tab, under Get more plugins."
          fi
          gh release upload plugins build/catalog/* --clobber

  ios:
    name: iPhone app to TestFlight
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check TestFlight is set up
        id: setup
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "TestFlight isn't set up yet, so the iPhone app was skipped. See docs/ios.md." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.setup.outputs.ready == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - if: steps.setup.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: steps.setup.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile && pnpm --filter @tessel/ios-shell sync
      - name: Archive, sign and upload to TestFlight
        if: steps.setup.outputs.ready == 'true'
        working-directory: packages/ios-shell/ios/App
        run: |
          # The App Store Connect API key signs in the cloud: no certificates to manage.
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}"
          sed "s/TEAM_ID/$APPLE_TEAM_ID/" ../ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"
          echo "Uploaded Tessel ${VERSION} (${{ github.run_number }}) to TestFlight." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "## Download"
            echo
            echo "- **macOS** (Apple silicon and Intel): \`Tessel-${VERSION}-universal.dmg\`"
            echo "- **Windows** (x64): \`Tessel-Setup-${VERSION}.exe\`"
            echo "- **Linux**: \`.AppImage\` or \`.deb\`"
            echo
            echo "Builds aren't signed yet. On macOS, right-click Tessel, choose Open, then Open again. On Windows, choose More info, then Run anyway. Installed copies update themselves (macOS shows a download link)."
            # What changed since the previous release, one line per commit.
            prev=$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty')
            echo
            echo "## Changes"
            echo
            if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
              git log --no-merges --pretty='- %s (%h)' "$prev..$GITHUB_SHA"
            else
              git log --no-merges --pretty='- %s (%h)' -20 "$GITHUB_SHA"
            fi
          } > notes.md
          gh release create "v${VERSION}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "Tessel ${VERSION}" \
            --notes-file notes.md \
            --latest
