name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            files: bin/*.dmg
          - os: windows-latest
            files: bin/*.exe
          - os: ubuntu-latest
            files: |
              bin/*.AppImage
              bin/*.deb
    runs-on: ${{ matrix.os }}
    env:
      # Signing is optional. Without these secrets the builds are unsigned (see docs/packaging.md).
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package
        shell: bash
        run: |
          if [ -n "$APPLE_ID" ] && [ "$RUNNER_OS" = "macOS" ]; then
            pnpm package -- --config.mac.notarize=true --publish never
          else
            pnpm package -- --publish never
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: tessel-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.files }}
          draft: true
