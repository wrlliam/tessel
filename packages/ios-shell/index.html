<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Tessel</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="/logo-mark.svg" alt="" width="40" height="40" />
        <h1>Tessel</h1>
      </header>
      <p class="muted">Tap. Build. Done.</p>

      <section aria-labelledby="found-title">
        <h2 id="found-title">Computers on this Wi-Fi</h2>
        <ul id="found" aria-live="polite"></ul>
        <p id="searching" class="muted">Looking for Tessel…</p>
      </section>

      <form id="manual">
        <label for="address">Or type the address shown on your computer</label>
        <div class="row">
          <input
            id="address"
            inputmode="url"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="192.168.1.20:4747"
          />
          <button type="submit">Connect</button>
        </div>
      </form>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
