packages:
  - packages/*
  - plugins/*
# Also fetch Windows x64 native binaries (koffi, libnut), so a Mac can build the Windows installer.
supportedArchitectures:
  os: [current, win32]
  cpu: [current, x64]
allowBuilds:
  electron: true
  esbuild: true
  koffi: true
  # Squirrel.Windows tooling; Tessel ships NSIS, so its download script is not needed.
  electron-winstaller: false
